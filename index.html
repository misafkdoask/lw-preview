    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b(D.salt), iterations: D.it, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(D.iv) }, key, b(D.ct)));
    store.set(pw);
    document.open(); document.write(html); document.close();
  }
  const f = document.getElementById('f'), go = document.getElementById('go'), err = document.getElementById('err');
  f.addEventListener('submit', (e) => {
    e.preventDefault(); err.textContent = ''; go.disabled = true;
    open(document.getElementById('pw').value).catch(() => { err.textContent = 'Wrong password'; go.disabled = false; });
  });
  const saved = store.get();
  if (saved) open(saved).catch(() => store.drop());
})();
</script>
</body>
